# ==============================================================================
# OPTIMIZATIONS FOR MACOS & BLUETOOTH STABILITY
# ==============================================================================

# Aumenta la potenza di trasmissione Bluetooth al massimo (+8 dBm)
# Risolve problemi di lag, disconnessioni o interferenze su macOS
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Abilita il supporto completo per ZMK Studio (se usato nel layer BLUE)
CONFIG_ZMK_STUDIO=y

# ==============================================================================
# POWER MANAGEMENT & BATTERY SAVING
# ==============================================================================

# Invia il livello della batteria a macOS
CONFIG_ZMK_BATTERY_REPORTING=y

# Abilita la modalità Deep Sleep (sospensione profonda)
CONFIG_ZMK_SLEEP=y

# Tempo di inattività prima di entrare in Idle (15 secondi - in millisecondi)
CONFIG_ZMK_IDLE_TIMEOUT=15000

# Tempo di inattività prima del Deep Sleep (15 minuti - in millisecondi)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ==============================================================================
# MOUSE & POINTING FEATURE
# ==============================================================================

# Abilita le funzionalità per il controllo del mouse (usate nel Layer MOU)
CONFIG_ZMK_POINTING=y

# ==============================================================================
# COMBOS & BEHAVIORS CONFIGURATION
# ==============================================================================

# Aumenta il numero massimo di combo gestibili per singolo tasto
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=6
